name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit tests (engine, mobile core, scripts incl. the real-product benchmark)
        run: pnpm test
      - name: Generated files are up to date
        run: |
          pnpm seed:build && pnpm bundle:build && pnpm deno:shared
          git diff --exit-code -- supabase/seed.sql apps/mobile/src/data supabase/functions/_shared
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x
      - name: Edge Functions
        working-directory: supabase/functions
        run: |
          deno check publish-bundle/index.ts ocr-fallback/index.ts
          deno test ocr-fallback/gemini_test.ts
      - name: Migrations, seed and RLS checks
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase-stubs.sql
          for f in supabase/migrations/*.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/rls-checks.sql
      - name: Build the website and admin
        run: pnpm --filter admin build
