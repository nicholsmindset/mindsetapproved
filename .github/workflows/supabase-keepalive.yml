# Keeps the free-plan Supabase project awake: Supabase pauses free projects after 7 days without activity.
# One read-only request a day (the same public call the app makes to check for rule updates).
# Delete this file once the project is on a paid plan.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC (11:17 am Singapore)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask for the latest rules version
        env:
          # Public anon key (the same one shipped in the app); it can only do what the app can do.
          URL: https://ywunhcftvroykiquejpg.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3dW5oY2Z0dnJveWtpcXVlanBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNDIyMzUsImV4cCI6MjExMDkxODIzNX0.NjiCWZRXZfyjKgNZ5o_6uSCEAapAOs1a4H_u1WhTiBk
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$URL/rest/v1/rpc/latest_rule_version" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
